<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточка проекта — Мониторинг 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    :root {
      --an-bg:#F2EEE7; --an-surface:#FAF7F2; --an-text:#111111;
      --an-muted:#7A6A56; --an-border:#D9D4CC;
      --an-terracota:#C75239; --an-sage:#7B9F8F; --an-radius:10px;
    }
    body { background:var(--an-bg); font-family:'Inter',sans-serif; color:var(--an-text); min-height:100vh; }

    .bg-bulb { position:fixed;top:0;left:50%;transform:translateX(-50%);width:512px;height:512px;opacity:.08;pointer-events:none;z-index:0; }

    /* Nav */
    .site-nav { position:sticky;top:0;z-index:50;background:var(--an-bg);border-bottom:1px solid var(--an-border);box-shadow:none;height:56px;padding:0 40px;font-family:'Inter',sans-serif; }
    .site-nav a { color:var(--an-text);font-size:14px;font-weight:500; }
    .site-nav a:hover { color:var(--an-terracota); }
    .site-nav b { font-family:'Lora',serif;font-size:16px;font-weight:700;letter-spacing:-.02em; }
    .site-nav span { color:var(--an-muted);font-size:13px; }
    #logout, .site-nav > button.button-secondary { font-family:'Inter',sans-serif;font-size:14px;font-weight:500;padding:4px 12px!important;background:transparent!important;border:1px solid var(--an-border)!important;border-radius:6px;color:var(--an-muted)!important;cursor:pointer;transition:border-color .15s,color .15s; }
    #logout:hover, .site-nav > button.button-secondary:hover { border-color:var(--an-terracota)!important;color:var(--an-terracota)!important; }
    .nav-votes { display:flex;align-items:center;gap:5px;margin-right:4px; }
    .nav-votes-label { display:none; }
    .nav-vote-slot { display:inline-block!important;width:11px!important;height:11px!important;border-radius:50%!important;background:var(--an-terracota)!important;font-size:0!important; }
    .nav-vote-used { background:var(--an-border)!important;opacity:1!important; }

    /* Container */
    .container { max-width:800px;margin:0 auto;padding:32px 40px;position:relative;z-index:1; }

    /* Back link */
    .back-link { display:inline-block;font-size:13px;color:var(--an-muted);text-decoration:none;margin-bottom:20px;transition:color .15s; }
    .back-link:hover { color:var(--an-terracota); }

    /* Hero / card-header */
    .card-header { display:block; margin-bottom:28px; }
    .card-header-top { display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px; }
    .card-header-code { font-size:13px;color:var(--an-muted); }
    .card-header-meta { display:flex;align-items:center;gap:8px;flex-wrap:wrap; }
    .card-header h1 { font-family:'Lora',serif;font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-bottom:0; }

    /* Badges */
    .badge { display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap; }
    .badge[data-status="Парковка"], .badge[data-status="Не начат"] { background:var(--an-border);color:var(--an-muted); }
    .badge[data-status="В работе"] { background:rgba(198,145,55,.18);color:#8B6014; }
    .badge[data-status="Выполнен"], .badge[data-status="ОК"] { background:#4E7A6C;color:#fff; }
    .badge[data-status="Отменён"], .badge[data-status="Отменена"] { background:rgba(199,82,57,.12);color:#C75239; }
    .badge[data-status="Просрочен"] { background:#C75239;color:#fff; }
    .badge-type { background:var(--an-border);color:var(--an-muted); }

    /* Sections */
    .detail-section { margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--an-border); }
    .detail-section:last-of-type { border-bottom:none; }
    .detail-section h2 { font-family:'Inter',sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--an-muted);margin-bottom:14px; }

    /* Fields */
    .detail-field { display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--an-border); }
    .detail-field:last-child { border-bottom:none; }
    .detail-field--block { display:block;padding:8px 0;border-bottom:1px solid var(--an-border); }
    .detail-label { font-size:12px;color:var(--an-muted);flex-shrink:0;width:220px;padding-top:1px; }
    .detail-field span:last-child { font-size:13px;color:var(--an-text);line-height:1.5; }

    /* details/summary */
    details > summary { cursor:pointer;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--an-muted);list-style:none;display:flex;align-items:center;gap:6px; }
    details > summary::before { content:'▶';font-size:9px;transition:transform .2s; }
    details[open] > summary::before { transform:rotate(90deg); }
    .steps-wrap { margin-top:10px; }

    /* Metrics table */
    .metrics-wrap { margin-top:10px;overflow-x:auto; }
    .metrics-wrap .table { background:var(--an-surface);border:1px solid var(--an-border);border-radius:var(--an-radius);box-shadow:none;width:100%;border-collapse:collapse; }
    .metrics-wrap .table th { background:var(--an-bg);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--an-muted);padding:8px 12px;font-weight:600;text-align:left; }
    .metrics-wrap .table td { padding:8px 12px;font-size:13px;border-top:1px solid var(--an-border); }

    /* Emoji mono */
    .icon-mono { display:inline-block;filter:grayscale(1);font-size:13px;vertical-align:middle;line-height:1;margin-right:4px; }

    /* Buttons */
    .button-primary { display:inline-flex;align-items:center;height:38px;padding:0 18px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:#fff;background:var(--an-terracota);border:none;border-radius:6px;cursor:pointer;text-decoration:none;transition:opacity .15s; }
    .button-primary:hover { background:var(--an-terracota);opacity:.82;color:#fff; }
    .button-secondary { display:inline-flex;align-items:center;height:38px;padding:0 18px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;color:var(--an-muted);background:transparent;border:1px solid var(--an-border);border-radius:6px;cursor:pointer;text-decoration:none;transition:border-color .15s,color .15s; }
    .button-secondary:hover { background:transparent;border-color:var(--an-text);color:var(--an-text); }

    /* Actions bar */
    .actions { display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;padding-top:24px;border-top:1px solid var(--an-border); }

    /* Spinner / states */
    .spinner { width:18px;height:18px;border:2px solid var(--an-border);border-top-color:var(--an-terracota);border-radius:50%;animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-state { display:flex;align-items:center;gap:10px;padding:32px 0;color:var(--an-muted); }
    .error { color:var(--an-terracota);font-size:14px; }

    @media(max-width:640px) {
      .container { padding:20px 16px; }
      .site-nav { padding:0 16px; }
      .site-nav > span:not(.nav-spacer):not(.nav-votes) { display:none; }
      .detail-field { flex-direction:column;gap:4px; }
      .detail-label { width:auto; }
    }
  </style>
</head>
<body>
  <img class="bg-bulb" src="assets/idea.png" alt="">
  <div class="container">
    <a href="map.html" class="back-link">← Карта проектов</a>
    <div id="content">
      <div class="loading-state"><div class="spinner"></div><span>Загрузка…</span></div>
    </div>
  </div>

  <script type="module">
    import { apiGet } from './assets/api.js';
    import { renderNav } from './assets/nav.js';
    renderNav();

    const code = new URLSearchParams(location.search).get('code');

    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function fmtMonth(iso) {
      if (!iso) return '—';
      const local = new Date(new Date(iso).getTime() + 3 * 60 * 60 * 1000);
      return local.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric', timeZone: 'UTC' });
    }

    function fmtNum(n) {
      if (n === null || n === undefined || n === '') return '—';
      return Number(n).toLocaleString('ru-RU');
    }

    function icon(emoji) {
      return `<span class="icon-mono">${emoji}</span>`;
    }

    // ── Загрузка ──────────────────────────────────────────────────────────────
    async function load() {
      const el = document.getElementById('content');
      if (!code) {
        el.innerHTML = '<p class="error">Код проекта не указан в URL (?code=...)</p>';
        return;
      }
      try {
        const res = await apiGet('projects.get', { code });
        if (!res.ok) throw new Error(res.error || 'ошибка API');
        render(res.data);
      } catch (err) {
        el.innerHTML = `<p class="error">Ошибка загрузки: ${esc(err.message)}</p>`;
      }
    }

    // ── Рендер ────────────────────────────────────────────────────────────────
    function render(p) {
      document.title = `${p.code} — ${p.name} — Мониторинг 2026`;

      // Метрики (раздел 2)
      const metricsHtml = (p.metrics && p.metrics.length)
        ? `<div class="metrics-wrap">
            <table class="table">
              <thead><tr>
                <th>Метрика</th>
                <th>Ед. измерения</th>
                <th>Текущее значение</th>
                <th>Целевое значение</th>
              </tr></thead>
              <tbody>
                ${p.metrics.map(m => `<tr>
                  <td>${esc(m.name)}</td>
                  <td>${esc(m.unit || '—')}</td>
                  <td>${m.current !== null ? esc(String(m.current)) : '—'}</td>
                  <td>${m.target !== null ? esc(String(m.target)) : '—'}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>`
        : '<p style="color:var(--an-muted);font-size:14px;padding:8px 0">Метрики не заполнены</p>';

      // Эффект Б/В/Г — только непустые (раздел 3)
      const extraEffects = ['effectB','effectV','effectG'].map((key, i) => {
        const e = p[key];
        if (!e || !e.amount) return '';
        const label = ['Б','В','Г'][i];
        return `<div class="detail-field">
          <span class="detail-label">${icon('💰')} Эффект ${label}</span>
          <span>${fmtNum(e.amount)} руб/год${e.desc && e.desc !== 'Описание:' ? ' — ' + esc(e.desc) : ''}</span>
        </div>`;
      }).join('');

      document.getElementById('content').innerHTML = `

        <!-- ── Шапка ── -->
        <div class="card-header">
          <div class="card-header-top">
            <div class="card-header-code">${esc(p.code)}</div>
            <div class="card-header-meta">
              <span class="badge" data-status="${esc(p.status)}">${esc(p.status)}</span>
              ${p.type ? `<span class="badge badge-type">${esc(p.type)}</span>` : ''}
            </div>
          </div>
          <h1>${esc(p.name)}</h1>
        </div>

        <!-- ── Мета-поля ── -->
        <section class="detail-section">
          <div class="detail-field"><span class="detail-label">Владелец</span><span>${esc(p.owner || '—')}</span></div>
          <div class="detail-field"><span class="detail-label">Старт</span><span>${fmtMonth(p.startMonth)}</span></div>
          <div class="detail-field"><span class="detail-label">Длительность</span><span>${p.months || p.duration || '—'} мес.</span></div>
        </section>

        <!-- ── Раздел 1: Проблема ── -->
        <section class="detail-section">
          <h2>1. Проблема</h2>
          <div class="detail-field">
            <span class="detail-label">Название</span>
            <span>${esc(p.problemTitle || '—')}</span>
          </div>
          <div class="detail-field detail-field--block">
            <details>
              <summary>Описание проблемы</summary>
              <div class="steps-wrap" style="font-size:14px;line-height:1.65;white-space:pre-line;padding-top:8px">${esc(p.problemDescription || '—')}</div>
            </details>
          </div>
          <div class="detail-field">
            <span class="detail-label">Текущие трудозатраты</span>
            <span>${p.currentHours ? fmtNum(p.currentHours) + ' ч/год' : '—'}</span>
          </div>
        </section>

        <!-- ── Раздел 2: Решение ── -->
        <section class="detail-section">
          <h2>2. Решение</h2>
          <div class="detail-field">
            <span class="detail-label">Описание</span>
            <span>${esc(p.solutionDescription || '—')}</span>
          </div>
          ${metricsHtml}
        </section>

        <!-- ── Раздел 3: Экономика ── -->
        <section class="detail-section">
          <h2>3. Экономика</h2>
          <div class="detail-field">
            <span class="detail-label">${icon('💸')} Бюджет проекта</span>
            <span>${p.budget ? fmtNum(p.budget) + ' руб.' : '—'}</span>
          </div>
          <div class="detail-field">
            <span class="detail-label">${icon('⏱')} Экономия времени</span>
            <span>${p.hoursSaved ? fmtNum(p.hoursSaved) + ' ч/год' : '—'}</span>
          </div>
          <div class="detail-field">
            <span class="detail-label">${icon('💰')} Прямой эффект (А)</span>
            <span>${p.effectA ? fmtNum(p.effectA) + ' руб/год' : '—'}</span>
          </div>
          ${extraEffects}
          <div class="detail-field">
            <span class="detail-label">${icon('💰')} Суммарный эффект</span>
            <span><strong>${fmtNum(p.totalEffect)} руб/год</strong></span>
          </div>
          <div class="detail-field">
            <span class="detail-label">${icon('📊')} ROI (1 год)</span>
            <span><strong>${p.roi ? Math.round(p.roi * 100) + '%' : '—'}</strong></span>
          </div>
          <div class="detail-field">
            <span class="detail-label">${icon('🗓')} Срок окупаемости</span>
            <span>${p.paybackMonths ? Math.ceil(p.paybackMonths) + ' мес.' : '—'}</span>
          </div>
        </section>

        <div class="actions">
          <a href="map.html" class="button-secondary">← Карта проектов</a>
        </div>
      `;
    }

    load();
  </script>
</body>
</html>
