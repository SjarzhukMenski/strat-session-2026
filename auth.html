<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Мониторинг 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    :root {
      --an-bg:        #F2EEE7;
      --an-surface:   #FAF7F2;
      --an-text:      #111111;
      --an-muted:     #7A6A56;
      --an-border:    #D9D4CC;
      --an-terracota: #C75239;
      --an-sage:      #7B9F8F;
      --an-radius:    10px;
    }

    body {
      background: var(--an-bg);
      font-family: 'Inter', sans-serif;
      color: var(--an-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-wrap { width: 100%; max-width: 420px; position: relative; z-index: 1; margin-top: 110px; }

    .bg-bulb {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 512px;
      height: 512px;
      opacity: 0.08;
      pointer-events: none;
      z-index: 0;
    }

    .auth-wordmark {
      font-family: 'Lora', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--an-muted);
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-card {
      background: var(--an-surface);
      border: 1px solid var(--an-border);
      border-radius: var(--an-radius);
      padding: 48px 40px 44px;
      text-align: center;
    }

    .auth-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-title {
      font-family: 'Lora', serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--an-text);
      margin: 0 0 8px;
    }

    .auth-desc {
      font-size: 14px;
      color: var(--an-muted);
      line-height: 1.55;
      margin: 0;
    }

    .auth-back {
      display: inline-block;
      margin-top: 20px;
      font-size: 13px;
      font-weight: 500;
      color: var(--an-terracota);
      text-decoration: none;
    }
    .auth-back:hover { text-decoration: underline; }

    /* Dots pulse while loading */
    @keyframes fade-dot {
      0%, 80%, 100% { opacity: .2; }
      40%            { opacity: 1;  }
    }
    .dot { display: inline-block; animation: fade-dot 1.2s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin-svg { animation: spin .9s linear infinite; }
  </style>
</head>
<body>
  <img class="bg-bulb" src="assets/idea.png" alt="">
  <div class="auth-wrap">
    <div class="auth-wordmark">Мониторинг наших инициатив</div>

    <div class="auth-card">
      <div class="auth-icon" id="icon">
        <svg class="spin-svg" width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="18" r="15" stroke="var(--an-border)" stroke-width="3"/>
          <path d="M18 3 A15 15 0 0 1 33 18" stroke="var(--an-muted)" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="auth-title" id="title">Проверяем ссылку<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></h1>
      <p class="auth-desc" id="desc"></p>
      <span id="action"></span>
    </div>
  </div>

  <script type="module">
    import { apiGet, setSession } from './assets/api.js';

    const iconEl   = document.getElementById('icon');
    const titleEl  = document.getElementById('title');
    const descEl   = document.getElementById('desc');
    const actionEl = document.getElementById('action');

    function setSuccess(name) {
      iconEl.innerHTML = `
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="18" r="15" stroke="var(--an-border)" stroke-width="3"/>
          <polyline points="10,18 15.5,23.5 26,12"
            stroke="var(--an-muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>`;
      titleEl.textContent = name ? `Добро пожаловать, ${name}` : 'Добро пожаловать';
      descEl.textContent = 'Перенаправляем вас на главную страницу…';
    }

    function setError(message) {
      iconEl.innerHTML = `
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="18" r="15" stroke="var(--an-border)" stroke-width="3"/>
          <line x1="12" y1="12" x2="24" y2="24" stroke="var(--an-muted)" stroke-width="3" stroke-linecap="round"/>
          <line x1="24" y1="12" x2="12" y2="24" stroke="var(--an-muted)" stroke-width="3" stroke-linecap="round"/>
        </svg>`;
      titleEl.textContent = 'Не удалось войти';
      descEl.textContent = message;
      actionEl.innerHTML = '<a class="auth-back" href="login.html">← Вернуться к форме входа</a>';
    }

    async function activate() {
      const token = new URLSearchParams(location.search).get('token');
      if (!token) {
        setError('Ссылка недействительна или устарела.');
        return;
      }

      try {
        const res = await apiGet('auth.activate', {
          token,
          user_agent: navigator.userAgent,
        });

        if (res.ok) {
          setSession(res.data);
          setSuccess(res.data.name || res.data.email);
          setTimeout(() => { location.href = 'board.html'; }, 1500);
        } else {
          const messages = {
            invalid_token:    'Ссылка недействительна.',
            already_used:     'Ссылка уже была использована. Запросите новую.',
            expired:          'Срок действия ссылки истёк. Запросите новую.',
            not_in_whitelist: 'Ваш email не найден в системе.',
          };
          setError(messages[res.error] || 'Ошибка входа.');
        }
      } catch (err) {
        setError('Ошибка соединения. Пожалуйста, попробуйте снова.');
      }
    }

    activate();
  </script>
</body>
</html>
