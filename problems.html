<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проблемы — Мониторинг 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    :root {
      --an-bg:#F2EEE7; --an-surface:#FAF7F2; --an-text:#111111;
      --an-muted:#7A6A56; --an-border:#D9D4CC;
      --an-terracota:#C75239; --an-sage:#7B9F8F; --an-radius:10px;
    }
    body { background:var(--an-bg); font-family:'Inter',sans-serif; color:var(--an-text); min-height:100vh; }

    /* Nav */
    .site-nav { position:sticky;top:0;z-index:50;background:var(--an-bg);border-bottom:1px solid var(--an-border);box-shadow:none;height:56px;padding:0 40px;font-family:'Inter',sans-serif; }
    .site-nav a { color:var(--an-text);font-size:14px;font-weight:500; }
    .site-nav a:hover { color:var(--an-terracota); }
    .site-nav b { font-family:'Lora',serif;font-size:16px;font-weight:700;letter-spacing:-.02em; }
    .site-nav span { color:var(--an-muted);font-size:13px; }
    #logout, .site-nav > button.button-secondary { font-family:'Inter',sans-serif;font-size:14px;font-weight:500;padding:4px 12px!important;background:transparent!important;border:1px solid var(--an-border)!important;border-radius:6px;color:var(--an-muted)!important;cursor:pointer;transition:border-color .15s,color .15s; }
    #logout:hover, .site-nav > button.button-secondary:hover { border-color:var(--an-terracota)!important;color:var(--an-terracota)!important; }
    .nav-votes { display:flex;align-items:center;gap:5px;margin-right:4px; }
    .nav-votes-label { display:none; }
    .nav-vote-slot { display:inline-block!important;width:11px;height:11px;border-radius:50%;background:var(--an-terracota);transition:background .2s; }
    .nav-vote-slot.used { background:var(--an-border); }

    /* Page */
    .container { max-width:1200px;margin:0 auto;padding:32px 40px; }
    h1 { font-family:'Lora',serif;font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:24px; }

    /* Tabs */
    .tabs { display:flex;gap:0;border-bottom:1px solid var(--an-border);margin-bottom:24px; }
    .tab { background:none;border:none;border-bottom:2px solid transparent;padding:10px 20px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;color:var(--an-muted);cursor:pointer;transition:color .15s,border-color .15s;margin-bottom:-1px; }
    .tab:hover { color:var(--an-text); }
    .tab.active { color:var(--an-terracota);border-bottom-color:var(--an-terracota); }

    /* Filters */
    .filters { display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center; }
    .filters .form-field, .filters input, .filters select { height:36px;padding:0 10px;font-family:'Inter',sans-serif;font-size:13px;background:var(--an-surface);border:1px solid var(--an-border);border-radius:6px;color:var(--an-text);outline:none;transition:border-color .15s; }
    .filters .form-field:focus, .filters input:focus, .filters select:focus { border-color:var(--an-terracota); }
    .filters input[type=search] { min-width:220px; }
    .btn-myvotes { height:36px;padding:0 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;background:var(--an-surface);border:1px solid var(--an-border);border-radius:6px;color:var(--an-muted);cursor:pointer;transition:border-color .15s,color .15s; }
    .btn-myvotes:hover, .btn-myvotes--active { border-color:var(--an-terracota);color:var(--an-terracota); }
    .sort-wrap { display:flex;gap:6px;align-items:center; }
    #btn-sort { height:36px;padding:0 12px;font-family:'Inter',sans-serif;font-size:13px;background:var(--an-surface);border:1px solid var(--an-border);border-radius:6px;color:var(--an-muted);cursor:pointer;transition:border-color .15s; }
    #btn-sort:hover { border-color:var(--an-terracota); }

    /* Table */
    .table { width:100%;border-collapse:collapse;background:var(--an-surface);border-radius:var(--an-radius);overflow:hidden;border:1px solid var(--an-border);box-shadow:none; }
    .table th { background:var(--an-bg);text-align:left;padding:10px 14px;font-family:'Inter',sans-serif;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--an-muted);border-bottom:1px solid var(--an-border); }
    .table td { padding:11px 14px;border-bottom:1px solid var(--an-border);font-size:13px;vertical-align:middle; }
    .table tr:last-child td { border-bottom:none; }
    .table tbody tr:hover { background:#F5F0E8;cursor:pointer; }
    .table a { color:var(--an-terracota);text-decoration:none; }
    .table a:hover { text-decoration:underline; }
    .row-voted td:first-child { border-left:3px solid var(--an-terracota); }

    /* Badges */
    .badge { display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap; }
    .badge[data-status="Парковка"], .badge[data-status="Не начат"] { background:var(--an-border);color:var(--an-muted); }
    .badge[data-status="В работе"] { background:#7B9F8F;color:#fff; }
    .badge[data-status="Выполнен"], .badge[data-status="ОК"] { background:#4E7A6C;color:#fff; }
    .badge[data-status="Отменён"], .badge[data-status="Отменена"] { background:rgba(199,82,57,.12);color:#C75239; }
    .badge[data-status="Просрочен"] { background:#C75239;color:#fff; }

    /* Vote buttons */
    .vote-btn { height:28px;padding:0 10px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;background:transparent;border:1px solid var(--an-border);border-radius:6px;color:var(--an-muted);cursor:pointer;transition:border-color .15s,color .15s;white-space:nowrap; }
    .vote-btn:hover:not(:disabled) { border-color:var(--an-terracota);color:var(--an-terracota); }
    .vote-btn--active { border-color:var(--an-terracota)!important;color:var(--an-terracota)!important; }
    .vote-btn--disabled { opacity:.4;cursor:not-allowed; }
    .vote-count { font-size:13px;color:var(--an-muted); }

    /* Misc */
    .count { font-size:13px;color:var(--an-muted);margin-top:10px; }
    .empty, .error { font-size:14px;color:var(--an-muted);padding:32px 0; }
    .loading-state { display:flex;align-items:center;gap:10px;padding:32px 0;color:var(--an-muted); }
    .spinner { width:18px;height:18px;border:2px solid var(--an-border);border-top-color:var(--an-terracota);border-radius:50%;animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    @media(max-width:640px) {
      .container { padding:20px 16px; }
      .site-nav { padding:0 16px; }
      .site-nav > span:not(.nav-spacer):not(.nav-votes) { display:none; }
    }
  </style>
</head>
<body>
  <script type="module" src="assets/nav.js">/* renderNav() вызывается ниже */</script>

  <div class="container">
    <h1>Проблемы</h1>

    <!-- Табы -->
    <div class="tabs" role="tablist">
      <button class="tab active" data-status="park"      role="tab">Парковка</button>
      <button class="tab"        data-status="inProject" role="tab">В проектах</button>
      <button class="tab"        data-status="cancelled" role="tab">Отменено</button>
    </div>

    <!-- Фильтры -->
    <div class="filters">
      <input id="q" type="search" placeholder="Поиск по названию или ФИО…" class="form-field">
      <select id="f-dept"    class="form-field"><option value="">Все подразделения</option></select>
      <select id="f-pstatus" class="form-field" style="display:none"><option value="">Все статусы проекта</option></select>
      <button id="f-myvotes" class="btn-myvotes">Показать мои 🔥</button>
      <div class="sort-wrap" style="display:none" id="sort-wrap">
        <select id="f-sort" class="form-field">
          <option value="">Без сортировки</option>
          <option value="votes">По голосам 🔥</option>
          <option value="hours">По затратам времени</option>
        </select>
        <button id="btn-sort" class="button-secondary" title="Применить сортировку">↕️</button>
      </div>
    </div>

    <!-- Таблица -->
    <div id="table-wrap">
      <div class="loading-state"><div class="spinner"></div><span>Загрузка…</span></div>
    </div>
  </div>

  <script type="module">
    import { apiGet, apiPost, getSession } from './assets/api.js';
    import { renderNav, renderNavVoteSlots } from './assets/nav.js';
    renderNav();

    const PROJECT_STATUSES = ['Не начат', 'В работе', 'Выполнен', 'Отменён'];

    const session = getSession();
    let currentStatus = 'park';
    let allRows = [];
    let votesState = { counts: {}, myVotes: [], remaining: 3, total: 3 };
    let myVotesOnly = false;
    let sortMode = '';

    // --- Загрузка данных ---
    async function load(uiStatus) {
      currentStatus = uiStatus;
      document.getElementById('table-wrap').innerHTML =
        '<div class="loading-state"><div class="spinner"></div><span>Загрузка…</span></div>';

      // Фильтр статуса проекта — только на вкладке inProject
      const pstatusEl = document.getElementById('f-pstatus');
      pstatusEl.style.display = uiStatus === 'inProject' ? '' : 'none';
      if (uiStatus !== 'inProject') pstatusEl.value = '';

      document.getElementById('sort-wrap').style.display = uiStatus === 'park' ? '' : 'none';
      document.getElementById('f-myvotes').style.display = uiStatus === 'park' ? '' : 'none';

      try {
        const [probRes, voteRes] = await Promise.all([
          apiGet('problems.list', { uiStatus }),
          uiStatus === 'park' ? apiGet('votes.getState') : Promise.resolve(null),
        ]);
        if (!probRes.ok) throw new Error(probRes.error);
        allRows = probRes.data;
        if (voteRes && voteRes.ok) {
          votesState = voteRes.data;
          renderNavVoteSlots(votesState.remaining, votesState.total);
        }
        populateFilters(allRows);
        render();
      } catch (err) {
        document.getElementById('table-wrap').innerHTML =
          `<p class="error">Ошибка загрузки: ${err.message}</p>`;
      }
    }

    // --- Фильтры ---
    function populateFilters(rows) {
      // Разбиваем составные подразделения по " / " и собираем атомарные значения
      const depts = [...new Set(
        rows.flatMap(r => (r.department || '').split(/\s*\/\s*/).map(s => s.trim()).filter(Boolean))
      )].sort();

      const deptSel    = document.getElementById('f-dept');
      const pstatusSel = document.getElementById('f-pstatus');
      const deptVal    = deptSel.value;

      deptSel.innerHTML = '<option value="">Все подразделения</option>' +
        depts.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
      pstatusSel.innerHTML = '<option value="">Все статусы проекта</option>' +
        PROJECT_STATUSES.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');

      deptSel.value = deptVal;
    }

    function filtered() {
      const q       = document.getElementById('q').value.toLowerCase();
      const dept    = document.getElementById('f-dept').value;
      const pstatus = document.getElementById('f-pstatus').value;
      return allRows.filter(r =>
        (!q       || (r.title||'').toLowerCase().includes(q) || (r.fio||'').toLowerCase().includes(q)) &&
        (!dept    || (r.department || '').split(/\s*\/\s*/).map(s => s.trim()).includes(dept)) &&
        (!pstatus || r.projectStatus === pstatus) &&
        (!myVotesOnly || votesState.myVotes.includes(r.code))
      );
    }

    // --- Рендер таблицы ---
    function render() {
      const rows = filtered();

      if (sortMode === 'votes') {
        rows.sort((a, b) => (votesState.counts[b.code] || 0) - (votesState.counts[a.code] || 0));
      } else if (sortMode === 'hours') {
        rows.sort((a, b) => (b.hoursPerYear || 0) - (a.hoursPerYear || 0));
      }

      const wrap = document.getElementById('table-wrap');
      const inProject = currentStatus === 'inProject';
      const isPark = currentStatus === 'park';

      if (!rows.length) {
        wrap.innerHTML = '<p class="empty">Ничего не найдено</p>';
        return;
      }

      wrap.innerHTML = `
        <table class="table">
          <thead>
            <tr>
              <th>ФИО</th>
              <th>Подразделение</th>
              <th>Название операции</th>
              <th style="text-align:center">Время на операцию, час./год.</th>
              <th>Проект</th>
              ${inProject ? '<th>Статус проекта</th>' : ''}
              ${isPark ? '<th style="text-align:center;width:70px">Голоса</th>' : ''}
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => `
              <tr class="clickable${votesState.myVotes.includes(r.code) ? ' row-voted' : ''}" data-row="${r.rowIndex}">
                <td>${esc(r.fio||'')}</td>
                <td>${esc(r.department||'')}</td>
                <td>${esc(r.title||'')}</td>
                <td style="text-align:center">${r.hoursPerYear != null ? esc(r.hoursPerYear) : 'нет данных'}</td>
                <td>${r.projectCode
                  ? `<a href="project.html?code=${encodeURIComponent(r.projectCode)}">${esc(r.projectCode)}</a>`
                  : '—'}</td>
                ${inProject ? `<td><span class="badge" data-status="${esc(r.projectStatus||'Не начат')}">${esc(r.projectStatus||'Не начат')}</span></td>` : ''}
                ${isPark ? `<td style="text-align:center">
                  ${renderVoteCell(r, session)}
                </td>` : ''}
              </tr>`).join('')}
          </tbody>
        </table>
        <p class="count">Показано: ${rows.length}</p>`;

      wrap.querySelectorAll('tr.clickable').forEach(tr =>
        tr.addEventListener('click', e => {
          if (e.target.tagName === 'A') return;
          if (e.target.closest('.vote-btn')) return;
          location.href = `problem.html?row=${tr.dataset.row}`;
        })
      );
    }

    function renderVoteCell(r, s) {
      const code = r.code || '';
      if (!code) return '—';
      const count = votesState.counts[code] || 0;
      const voted = votesState.myVotes.includes(code);
      const label = count > 0 ? `🔥 ${count}` : '🔥 0';
      if (!s) return `<span class="vote-count">${label}</span>`;
      const disabled = !voted && votesState.remaining <= 0;
      return `<button class="vote-btn${voted ? ' vote-btn--active' : ''}${disabled ? ' vote-btn--disabled' : ''}"
        data-code="${esc(code)}" ${disabled ? 'disabled' : ''}>${label}</button>`;
    }

    async function toggleVote(code) {
      const voted = votesState.myVotes.includes(code);
      // Оптимистичное обновление
      if (voted) {
        votesState.myVotes = votesState.myVotes.filter(c => c !== code);
        votesState.counts[code] = Math.max(0, (votesState.counts[code] || 1) - 1);
        votesState.remaining++;
      } else {
        votesState.myVotes.push(code);
        votesState.counts[code] = (votesState.counts[code] || 0) + 1;
        votesState.remaining--;
      }
      renderNavVoteSlots(votesState.remaining, votesState.total);
      render();

      try {
        const res = await apiPost('votes.toggle', { problemCode: code });
        if (!res.ok) throw new Error(res.error);
        votesState = res.data;
        renderNavVoteSlots(votesState.remaining, votesState.total);
        render();
      } catch (err) {
        // Откат
        if (voted) {
          votesState.myVotes.push(code);
          votesState.counts[code] = (votesState.counts[code] || 0) + 1;
          votesState.remaining--;
        } else {
          votesState.myVotes = votesState.myVotes.filter(c => c !== code);
          votesState.counts[code] = Math.max(0, (votesState.counts[code] || 1) - 1);
          votesState.remaining++;
        }
        renderNavVoteSlots(votesState.remaining, votesState.total);
        render();
        alert('Ошибка голосования: ' + err.message);
      }
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // --- События ---
    document.querySelectorAll('.tab').forEach(btn =>
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        load(btn.dataset.status);
      })
    );

    document.getElementById('q').addEventListener('input', render);
    document.getElementById('f-dept').addEventListener('change', render);
    document.getElementById('f-pstatus').addEventListener('change', render);

    document.getElementById('f-myvotes').addEventListener('click', () => {
      myVotesOnly = !myVotesOnly;
      document.getElementById('f-myvotes').classList.toggle('btn-myvotes--active', myVotesOnly);
      render();
    });

    document.getElementById('btn-sort').addEventListener('click', () => {
      sortMode = document.getElementById('f-sort').value;
      render();
    });

    // Делегирование кликов по кнопкам голосования
    document.getElementById('table-wrap').addEventListener('click', e => {
      const btn = e.target.closest('.vote-btn');
      if (btn && !btn.disabled) toggleVote(btn.dataset.code);
    });

    load('park');
  </script>
</body>
</html>
