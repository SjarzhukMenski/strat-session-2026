<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта проектов 2026 — Мониторинг</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* ── Anthropic design tokens ── */
    :root {
      --an-bg:        #F2EEE7;
      --an-surface:   #FAF7F2;
      --an-text:      #111111;
      --an-muted:     #7A6A56;
      --an-border:    #D9D4CC;
      --an-terracota: #C75239;
      --an-sage:      #7B9F8F;
      --an-radius:    10px;

      /* Переопределяем цвета gantt-баров (style.css читает эти переменные) */
      --c-not-started: var(--an-border);
      --c-in-progress: rgba(198,145,55,.55);
      --c-done:        #4E7A6C;
      --c-cancelled:   rgba(199,82,57,.22);
      --c-overdue:     rgba(199,82,57,.55);
    }

    body {
      background: var(--an-bg);
      font-family: 'Inter', sans-serif;
      color: var(--an-text);
      min-height: 100vh;
    }

    /* ── Nav override ── */
    .site-nav {
      position: sticky; top: 0; z-index: 50;
      background: var(--an-bg);
      border-bottom: 1px solid var(--an-border);
      box-shadow: none;
      height: 56px; padding: 0 40px;
      font-family: 'Inter', sans-serif;
    }
    .site-nav a { color: var(--an-text); font-size: 14px; font-weight: 500; }
    .site-nav a:hover { color: var(--an-terracota); }
    .site-nav b { font-family: 'Lora', serif; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
    .site-nav span { color: var(--an-muted); font-size: 13px; }
    #logout, .site-nav > button.button-secondary {
      font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
      padding: 4px 12px !important;
      background: transparent !important;
      border: 1px solid var(--an-border) !important;
      border-radius: 6px;
      color: var(--an-muted) !important;
      cursor: pointer; transition: border-color .15s, color .15s;
    }
    #logout:hover, .site-nav > button.button-secondary:hover {
      border-color: var(--an-terracota) !important;
      color: var(--an-terracota) !important;
    }
    .nav-vote-slot {
      display: inline-block !important; width: 11px !important; height: 11px !important;
      border-radius: 50% !important; background: var(--an-terracota) !important; font-size: 0 !important;
    }
    .nav-vote-used { background: var(--an-border) !important; opacity: 1 !important; }

    /* ── Status filter chips ── */
    .gantt-counters { gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .gantt-status-btn {
      background: var(--an-surface); border: 1px solid var(--an-border);
      border-radius: 20px; padding: 4px 14px; font-size: 13px;
      font-family: 'Inter', sans-serif; cursor: pointer;
      color: var(--an-muted); transition: opacity .15s;
      box-shadow: none;
    }
    .gantt-status-btn:not(.active) { opacity: 0.45; }
    .gantt-status-btn.active { background: var(--chip-color); color: #fff; border-color: transparent; }
    .gantt-status-btn:hover { opacity: 1; }

    /* ── Gantt table ── */
    .gantt-wrap {
      background: var(--an-surface);
      border: 1px solid var(--an-border);
      border-radius: var(--an-radius);
      overflow-x: auto;
    }
    .gantt-table th {
      background: var(--an-bg);
      font-size: 11px; text-transform: uppercase;
      letter-spacing: .06em; color: var(--an-muted);
      border: 1px solid var(--an-border);
    }
    .gantt-table td { border: 1px solid var(--an-border); }
    .gantt-row:hover .gantt-name-td { background: #F5F0E8; }
    .gantt-code-link {
      font-family: 'Inter', sans-serif; font-weight: 600;
      color: var(--an-terracota); font-size: 13px;
    }
    .gantt-name-text { color: var(--an-muted); }
    .gantt-owner { color: var(--an-muted); }
    .gantt-team-row td { background: var(--an-bg); color: var(--an-muted); border-top: 2px solid var(--an-border); }
    .overdue-icon { vertical-align: middle; margin-left: 4px; flex-shrink: 0; display: inline-block; }

    /* ── an-card (effect summary) ── */
    .an-card {
      background: var(--an-surface);
      border: 1px solid var(--an-border);
      border-radius: var(--an-radius);
    }
  </style>
</head>
<body>
  <script type="module" src="assets/nav.js">/* renderNav() вызывается ниже */</script>

  <!-- Тултип — вне scroll-контейнера, позиционируется JS -->
  <div id="gantt-tip" class="gantt-tooltip-popup"></div>

  <div class="container">
    <div class="page-header" style="padding: 32px 0 20px">
      <h1 style="font-family:'Lora',serif; font-size:29px; font-weight:700;
                 letter-spacing:-0.02em; margin:0; color:var(--an-text)">
        Карта проектов 2026
      </h1>
    </div>

    <!-- Чипы-фильтры (они же счётчики). Кликнуть = включить/выключить статус -->
    <div id="status-chips" class="gantt-counters" style="margin-bottom:20px"></div>

    <!-- Гант -->
    <div id="gantt-container">
      <div class="loading-state"><div class="spinner"></div><span>Загрузка…</span></div>
    </div>

    <!-- Таблица ожидаемого / фактического эффекта (по выборке фильтра) -->
    <div id="effect-table"></div>
  </div>

  <script type="module">
    import { apiGet } from './assets/api.js';
    import { renderNav } from './assets/nav.js';
    renderNav();

    const MONTHS       = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
    const STATUS_ORDER = ['Не начат','В работе','Выполнен','Отменён'];
    const STATUS_COLORS = {
      'Не начат': 'var(--an-muted)',
      'В работе': 'rgba(198,145,55,.85)',
      'Выполнен': '#4E7A6C',
      'Отменён':  'rgba(199,82,57,.75)',
    };

    let allProjects   = [];
    // Множество активных статусов. Пустое = все активны.
    let activeStatuses = new Set();

    // ── Утилиты дат ───────────────────────────────────────────────────────────
    function isoToLocal(iso) {
      if (!iso) return null;
      return new Date(new Date(iso).getTime() + 3 * 60 * 60 * 1000);
    }
    function isoToMonth(iso) { const d = isoToLocal(iso); return d ? d.getUTCMonth() : null; }
    function isoToYear(iso)  { const d = isoToLocal(iso); return d ? d.getUTCFullYear() : null; }

    const _now      = isoToLocal(new Date().toISOString());
    const CUR_YEAR  = _now.getUTCFullYear();
    const CUR_MONTH = _now.getUTCMonth();

    // ── Утилиты форматирования ────────────────────────────────────────────────
    function fmtNum(n) {
      if (n === null || n === undefined || n === '') return '—';
      return Number(n).toLocaleString('ru-RU');
    }
    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Загрузка ──────────────────────────────────────────────────────────────
    async function load() {
      try {
        const res = await apiGet('projects.list');
        if (!res.ok) throw new Error(res.error || 'ошибка API');
        allProjects = res.data;
        // Инициализируем фильтр — все статусы активны
        const statuses = [...new Set(allProjects.map(p => p.status).filter(Boolean))];
        statuses.forEach(s => activeStatuses.add(s));
        render();
      } catch (err) {
        document.getElementById('gantt-container').innerHTML =
          `<p class="error">Ошибка загрузки: ${esc(err.message)}</p>`;
      }
    }

    function filtered() {
      return allProjects.filter(p => activeStatuses.has(p.status));
    }

    // ── Чипы-фильтры ─────────────────────────────────────────────────────────
    function renderStatusChips(visibleCount) {
      const bySt = {};
      STATUS_ORDER.forEach(s => (bySt[s] = 0));
      for (const p of allProjects) {
        if (bySt[p.status] !== undefined) bySt[p.status]++;
      }

      const chips = STATUS_ORDER
        .filter(s => bySt[s] > 0)
        .map(s => {
          const on = activeStatuses.has(s);
          return `<button class="gantt-status-btn${on ? ' active' : ''}"
            data-status="${esc(s)}"
            style="--chip-color:${STATUS_COLORS[s]}"
            title="${on ? 'Кликнуть — скрыть' : 'Кликнуть — показать'}">
            ${esc(s)}: <strong>${bySt[s]}</strong>
          </button>`;
        }).join('');

      const showingAll = activeStatuses.size === allProjects.length ||
        STATUS_ORDER.filter(s => bySt[s] > 0).every(s => activeStatuses.has(s));

      document.getElementById('status-chips').innerHTML = `
        <span style="font-size:13px; color:var(--an-muted); font-family:'Inter',sans-serif; align-self:center">
          Показано: <strong style="color:var(--an-text)">${visibleCount}</strong> из ${allProjects.length}
        </span>
        ${chips}`;

      document.querySelectorAll('.gantt-status-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const s = btn.dataset.status;
          if (activeStatuses.has(s)) {
            // Не даём скрыть последний активный статус
            if (activeStatuses.size > 1) activeStatuses.delete(s);
          } else {
            activeStatuses.add(s);
          }
          render();
        });
      });
    }

    // ── Итоги эффекта (по filtered) ───────────────────────────────────────────
    function renderEffectTable(rows) {
      const expHours = rows.reduce((s, p) => s + (Number(p.hoursSaved) || 0), 0);
      const expRub   = rows.reduce((s, p) => s + (Number(p.effect)     || 0), 0);

      const isFiltered = rows.length < allProjects.length;
      const title = isFiltered
        ? `Ожидаемый эффект по выборке (${rows.length} из ${allProjects.length})`
        : 'Ожидаемый эффект';

      document.getElementById('effect-table').innerHTML = `
        <div class="an-card" style="margin-top:16px; padding:14px 20px;
          display:flex; align-items:center; gap:32px; flex-wrap:wrap">
          <span style="font-size:13px; color:var(--an-muted); font-weight:500; font-family:'Inter',sans-serif">
            ${esc(title)}
          </span>
          <span style="font-size:14px; font-family:'Inter',sans-serif">
            ⏱ Экономия: <strong>${expHours ? fmtNum(expHours) + '&nbsp;чел.×ч/год' : '—'}</strong>
          </span>
          <span style="font-size:14px; font-family:'Inter',sans-serif">
            💰 Эффект: <strong>${expRub ? fmtNum(Math.round(expRub)) + '&nbsp;руб.' : '—'}</strong>
          </span>
        </div>`;
    }

    const OVERDUE_SVG = `<svg class="overdue-icon" width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M6.5 2L11.5 11H1.5L6.5 2Z" stroke="var(--an-terracota)" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="6.5" y1="5.5" x2="6.5" y2="7.5" stroke="var(--an-terracota)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="6.5" cy="9.2" r=".6" fill="var(--an-terracota)"/>
</svg>`;

    // ── Рендер Ганта ──────────────────────────────────────────────────────────
    function render() {
      const rows = filtered();

      renderStatusChips(rows.length);
      renderEffectTable(rows);

      const container = document.getElementById('gantt-container');
      if (!rows.length) {
        container.innerHTML = '<p class="empty">Нет проектов по выбранному фильтру</p>';
        return;
      }

      // Хронологическая сортировка
      rows.sort((a, b) => new Date(a.startMonth) - new Date(b.startMonth));

      const thead = `<thead><tr>
        <th class="gantt-name-th">Проект</th>
        ${MONTHS.map(m => `<th class="gantt-month-th">${m}</th>`).join('')}
      </tr></thead>`;

      const tbodyRows = rows.map(p => {
        const sm = isoToMonth(p.startMonth) ?? 0;
        const em = isoToMonth(p.endMonth)   ?? 0;
        const sy = isoToYear(p.startMonth)  ?? 2026;
        const ey = isoToYear(p.endMonth)    ?? 2026;

        const start = sy < 2026 ? 0  : sy > 2026 ? 13 : sm;
        const end   = ey > 2026 ? 11 : ey < 2026 ? -1 : em;

        const overdueStart = p.status === 'Не начат' &&
          (sy < CUR_YEAR || (sy === CUR_YEAR && sm < CUR_MONTH));
        const overdueEnd = p.status !== 'Выполнен' && p.status !== 'Отменён' &&
          (ey < CUR_YEAR || (ey === CUR_YEAR && em < CUR_MONTH));
        const overdue = overdueStart || overdueEnd;

        const cells = MONTHS.map((_, i) => i >= start && i <= end
          ? `<td class="gantt-bar-cell" data-status="${esc(p.status)}"${overdue ? ' data-overdue="true"' : ''}></td>`
          : `<td class="gantt-empty-cell"></td>`
        ).join('');

        // Показываем владельца: имя (после нового деплоя) или email как запасной вариант
        const ownerLabel = p.owner || (p.ownerEmail ? p.ownerEmail.split('@')[0] : '');

        return `<tr class="gantt-row" data-code="${esc(p.code)}">
          <td class="gantt-name-td">
            <a class="gantt-code-link" href="project.html?code=${encodeURIComponent(p.code)}">${esc(p.code)}${overdue ? OVERDUE_SVG : ''}</a>
            <span class="gantt-name-text">${esc(p.name)}</span>
            <div class="gantt-row-meta">
              <span class="badge" data-status="${esc(p.status)}">${esc(p.status)}</span>
              ${ownerLabel ? `<span class="gantt-owner">👤 ${esc(ownerLabel)}</span>` : ''}
            </div>
          </td>
          ${cells}
        </tr>`;
      }).join('');

      container.innerHTML = `
        <div class="gantt-wrap">
          <table class="gantt-table">
            ${thead}
            <tbody>${tbodyRows}</tbody>
          </table>
        </div>`;

      attachTooltips();
    }

    // ── Тултипы ───────────────────────────────────────────────────────────────
    const tip = document.getElementById('gantt-tip');

    function buildTipHtml(p) {
      const lines = [];
      if (p.hoursSaved)    lines.push(`⏱ Экономия времени: ${fmtNum(p.hoursSaved)} ч/год`);
      if (p.effect)        lines.push(`💰 Ожидаемый эффект: ${fmtNum(p.effect)} руб.`);
      if (p.budget)        lines.push(`💸 Бюджет проекта: ${fmtNum(p.budget)} руб.`);
      if (p.roi)           lines.push(`📊 ROI: ${Math.round(p.roi * 100)}%`);
      if (p.paybackMonths) lines.push(`🗓 Окупаемость: ${Number(p.paybackMonths).toFixed(1)} мес.`);
      if (!lines.length)   lines.push('Экономика не заполнена');
      return lines.map(l => `<div>${esc(l)}</div>`).join('');
    }

    function moveTip(e) {
      const x = e.clientX + 16;
      const y = e.clientY + 16;
      tip.style.left = Math.min(x, window.innerWidth  - tip.offsetWidth  - 8) + 'px';
      tip.style.top  = Math.min(y, window.innerHeight - tip.offsetHeight - 8) + 'px';
    }

    function attachTooltips() {
      document.querySelectorAll('.gantt-row').forEach(row => {
        const p = allProjects.find(pr => pr.code === row.dataset.code);
        if (!p) return;
        row.addEventListener('mouseenter', e => {
          tip.innerHTML = buildTipHtml(p);
          tip.style.display = 'block';
          moveTip(e);
        });
        row.addEventListener('mousemove', moveTip);
        row.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
      });
    }

    load();

  </script>
</body>
</html>
