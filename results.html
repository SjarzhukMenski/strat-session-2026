<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Результаты проектов — Мониторинг 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    /* ── Anthropic design tokens ── */
    :root {
      --an-bg:        #F2EEE7;
      --an-surface:   #FAF7F2;
      --an-text:      #111111;
      --an-muted:     #7A6A56;
      --an-border:    #D9D4CC;
      --an-terracota: #C75239;
      --an-sage:      #7B9F8F;
      --an-radius:    10px;
    }

    body {
      background: var(--an-bg);
      font-family: 'Inter', sans-serif;
      color: var(--an-text);
      min-height: 100vh;
    }

    /* ── Nav overrides ── */
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--an-bg);
      border-bottom: 1px solid var(--an-border);
      box-shadow: none;
      height: 56px;
      padding: 0 40px;
      font-family: 'Inter', sans-serif;
    }
    .site-nav a { color: var(--an-text); font-size: 14px; font-weight: 500; }
    .site-nav a:hover { color: var(--an-terracota); }
    .site-nav b { font-family: 'Lora', serif; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
    #logout, .site-nav > button.button-secondary {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 4px 12px !important;
      background: transparent !important;
      border: 1px solid var(--an-border) !important;
      border-radius: 6px;
      color: var(--an-muted) !important;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    #logout:hover, .site-nav > button.button-secondary:hover {
      border-color: var(--an-terracota) !important;
      color: var(--an-terracota) !important;
    }
    .site-nav > span:not(.nav-spacer):not(.nav-votes) {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--an-muted);
    }
    .nav-votes {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-right: 4px;
    }
    .nav-votes-label { display: none; }
    .nav-vote-slot {
      display: inline-block !important;
      width: 11px !important;
      height: 11px !important;
      border-radius: 50% !important;
      background: var(--an-terracota) !important;
      font-size: 0 !important;
    }
    .nav-vote-used {
      background: var(--an-border) !important;
      opacity: 1 !important;
    }
    @media (max-width: 640px) {
      .site-nav > span:not(.nav-spacer):not(.nav-votes) { display: none; }
    }

    /* ── Page container ── */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 40px 48px;
    }

    /* ── Page title ── */
    .page-header h1 {
      font-family: 'Lora', serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--an-text);
      margin-bottom: 24px;
      letter-spacing: -0.01em;
    }

    /* ── KPI grid ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .kpi-grid { grid-template-columns: 1fr; } }

    .kpi-card {
      background: var(--an-surface);
      border: 1px solid var(--an-border);
      border-radius: var(--an-radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 158px;
    }
    .kpi-header {
      background: var(--an-sage);
      padding: 0 16px;
      height: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .kpi-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.88);
      line-height: 1.35;
    }
    .kpi-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
    }
    .kpi-value {
      font-family: 'Lora', serif;
      font-size: 40px;
      font-weight: 700;
      color: var(--an-text);
      text-align: center;
      line-height: 1.2;
    }
    .kpi-unit {
      font-size: 20px;
      font-weight: 700;
      color: var(--an-text);
      font-family: 'Lora', serif;
    }
    /* PNG/SVG иконки — фиксированный slot 20×20, масштаб через transform */
    .kpi-icon-img, .kpi-icon-svg {
      width: 20px;
      height: 20px;
      object-fit: contain;
      filter: invert(1);
      mix-blend-mode: screen;
      flex-shrink: 0;
    }
    .kpi-icon--up   { transform: scale(1.25); }
    .kpi-icon--xl   { transform: scale(1.50); }
    .kpi-icon--down { transform: scale(0.82); }

    /* ── Info row ── */
    .info-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }
    @media (max-width: 720px) { .info-row { grid-template-columns: 1fr; } }

    .info-card {
      background: var(--an-surface);
      border: 1px solid var(--an-border);
      border-radius: var(--an-radius);
      overflow: hidden;
    }
    .info-card-header {
      background: var(--an-sage);
      padding: 0 16px;
      height: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .info-card-header h3 {
      font-family: 'Lora', serif;
      font-size: 15px;
      font-weight: 600;
      color: rgba(255,255,255,0.92);
      margin: 0;
    }
    .info-card-body {
      padding: 20px;
    }

    /* ── Leaderboard ── */
    .leader-item {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .leader-medal { font-size: 22px; width: 28px; text-align: center; }
    .leader-bar-wrap { flex: 1; }
    .leader-name { font-size: 14px; font-weight: 500; color: var(--an-text); margin-bottom: 6px; }
    .leader-bar-bg { background: var(--an-border); border-radius: 5px; height: 10px; }
    .leader-bar-fill { height: 10px; border-radius: 5px; background: var(--an-terracota); }
    .leader-count { font-size: 16px; font-weight: 700; color: var(--an-text); min-width: 24px; text-align: right; }

    /* ── Chart ── */
    .chart-wrap { position: relative; height: 220px; }

    /* ── Table wrapper ── */
    .table-wrap {
      background: var(--an-surface);
      border: 1px solid var(--an-border);
      border-radius: var(--an-radius);
      overflow: hidden;
    }

    /* ── Results table ── */
    .results-table { width: 100%; border-collapse: collapse; }
    .results-table th {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--an-border);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--an-muted);
      background: var(--an-bg);
    }
    .results-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--an-border);
      font-size: 13px;
      color: var(--an-text);
    }
    .results-table tr.data-row:hover { background: #F5F0E8; cursor: pointer; }
    .results-table tr.expand-row td { padding: 0; }

    /* ── Accordion expand ── */
    .expand-inner {
      padding: 16px 20px;
      background: var(--an-bg);
      border-bottom: 2px solid var(--an-border);
    }
    .expand-inner h4 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--an-muted);
      margin: 12px 0 6px;
    }
    .expand-inner h4:first-child { margin-top: 0; }

    .expand-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 8px; }
    .expand-table th, .expand-table td {
      padding: 6px 10px;
      text-align: right;
      border-bottom: 1px solid var(--an-border);
    }
    .expand-table th:first-child, .expand-table td:first-child { text-align: left; }
    .expand-table th {
      background: var(--an-surface);
      color: var(--an-muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .comment-box {
      background: var(--an-surface);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--an-text);
      border: 1px solid var(--an-border);
    }

    .toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: var(--an-muted);
      transition: transform .2s, color .15s;
      padding: 0;
      line-height: 1;
    }
    .toggle-btn.open {
      transform: rotate(90deg);
      color: var(--an-terracota);
    }

    .pct-positive { color: #4E7A6C !important; font-weight: 600; }
    .pct-negative { color: #C75239 !important; font-weight: 600; }
  </style>
</head>
<body>
  <script type="module" src="assets/nav.js"></script>

  <div class="container">
    <div class="page-header">
      <h1>Текущие результаты проектов</h1>
    </div>

    <div id="page-content">
      <div class="loading-state"><div class="spinner"></div><span>Загрузка…</span></div>
    </div>
  </div>

  <script type="module">
    import { apiGet, getSession } from './assets/api.js';
    import { renderNav } from './assets/nav.js';
    renderNav();

    if (!getSession()) { location.href = 'login.html'; }

    const fmtNum = n => (n == null || n === '') ? '—'
      : Number(n).toLocaleString('ru-RU');
    const fmtRub = n => (n == null || n === '') ? '—'
      : Math.round(Number(n)).toLocaleString('ru-RU') + ' руб.';
    const fmtPct = n => (n == null || n === '') ? '—'
      : Number(n).toFixed(1) + '%';
    const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    /* Icons for KPI card headers (20px, white on terracota) */
    const KPI = {
      done:      `<img class="kpi-icon-img" src="assets/Done.png" alt="">`,
      time:      `<img class="kpi-icon-img" src="assets/time1.png" alt="">`,
      effect:    `<img class="kpi-icon-img" src="assets/income1.png" alt="">`,
      costs:     `<img class="kpi-icon-img kpi-icon--up" src="assets/costs1.png" alt="">`,
      roi:       `<img class="kpi-icon-img kpi-icon--down" src="assets/ROI1.png" alt="">`,
      barTarget: `<svg class="kpi-icon-svg kpi-icon--up" width="20" height="20" viewBox="0 0 28 28" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round">
        <rect x="4" y="17" width="5" height="8" rx="1.5"/>
        <rect x="11.5" y="11" width="5" height="14" rx="1.5"/>
        <rect x="19" y="6" width="5" height="19" rx="1.5"/>
        <line x1="2" y1="13" x2="26" y2="13" stroke-dasharray="2.5,2" stroke-width="1.4"/>
      </svg>`,
    };

    /* PNG icons for info-card headers (same size as kpi-icon-img) */
    const ICON = {
      trophy: `<img class="kpi-icon-img kpi-icon--xl" src="assets/Thanks.png" alt="">`,
      pie:    `<img class="kpi-icon-img kpi-icon--xl" src="assets/employers.png" alt="">`,
    };

    async function init() {
      const res = await apiGet('results.list');
      if (!res.ok) {
        document.getElementById('page-content').innerHTML =
          `<div class="empty-state">Ошибка загрузки: ${esc(res.error)}</div>`;
        return;
      }
      const { projects, summary } = res.data;
      document.getElementById('page-content').innerHTML = renderPage(projects, summary);
      attachAccordion();
      renderCharts(projects);
    }

    function renderPage(projects, s) {
      const factVsExp = s.totalEffectTarget > 0
        ? Math.round(s.totalEffectActual / s.totalEffectTarget * 1000) / 10
        : 0;

      return `
        <div class="kpi-grid">
          ${kpiCard(KPI.done,      'Завершено проектов',            s.count,                    null)}
          ${kpiCard(KPI.time,      'Экономия времени',              fmtNum(s.totalHoursSaved),   'час./год')}
          ${kpiCard(KPI.effect,    'Экономический эффект (факт)',   fmtRub(s.totalEffectActual), null)}
          ${kpiCard(KPI.costs,     'Затраты на реализацию (факт)', fmtRub(s.totalCostActual),   null)}
          ${kpiCard(KPI.barTarget, 'Факт vs Ожидание',              fmtPct(factVsExp),           null)}
          ${kpiCard(KPI.roi,       'ROI первого года',              fmtPct(s.roiPct),            null)}
        </div>

        <div class="info-row">
          <div class="info-card">
            <div class="info-card-header">
              ${ICON.trophy}
              <h3>Лидеры по реализованным проектам</h3>
            </div>
            <div class="info-card-body">
              <div id="leaderboard">${renderLeaderboard(projects)}</div>
            </div>
          </div>
          <div class="info-card">
            <div class="info-card-header">
              ${ICON.pie}
              <h3>Проекты по подразделениям</h3>
            </div>
            <div class="info-card-body">
              <div class="chart-wrap"><canvas id="deptChart"></canvas></div>
            </div>
          </div>
        </div>

        <div class="table-wrap">
          <table class="results-table">
            <thead>
              <tr>
                <th></th>
                <th>Код</th>
                <th>Название</th>
                <th>Ответственный</th>
                <th>Дата</th>
                <th style="text-align:right">Экономия часов<br>(ч/год)</th>
                <th style="text-align:right">Эффект (факт)</th>
              </tr>
            </thead>
            <tbody>
              ${projects.length
                ? projects.map((p, i) => renderProjectRows(p, i)).join('')
                : '<tr><td colspan="7" style="text-align:center;color:var(--an-muted);padding:32px">Нет выполненных проектов</td></tr>'
              }
            </tbody>
          </table>
        </div>
      `;
    }

    function kpiCard(iconHtml, label, value, unit) {
      return `
        <div class="kpi-card">
          <div class="kpi-header">
            ${iconHtml}
            <div class="kpi-label">${esc(label)}</div>
          </div>
          <div class="kpi-body">
            <div class="kpi-value">${value}${unit ? `<span class="kpi-unit"> ${esc(unit)}</span>` : ''}</div>
          </div>
        </div>`;
    }

    function renderLeaderboard(projects) {
      const counts = {};
      const effects = {};
      projects.forEach(p => {
        const owner = p.owner || '—';
        counts[owner] = (counts[owner] || 0) + 1;
        effects[owner] = (effects[owner] || 0) + (Number(p.economics?.total?.actual) || 0);
      });
      const sorted = Object.entries(counts)
        .sort((a, b) => b[1] - a[1] || (effects[b[0]] || 0) - (effects[a[0]] || 0))
        .slice(0, 3);
      if (!sorted.length) return '<p style="color:var(--an-muted)">Нет данных</p>';
      const max = sorted[0][1];
      const medals = ['🥇','🥈','🥉'];
      return sorted.map(([name, cnt], i) => `
        <div class="leader-item">
          <div class="leader-medal">${medals[i]}</div>
          <div class="leader-bar-wrap">
            <div class="leader-name">${esc(name)}</div>
            <div class="leader-bar-bg">
              <div class="leader-bar-fill" style="width:${Math.round(cnt/max*100)}%"></div>
            </div>
          </div>
          <div class="leader-count">${cnt}</div>
        </div>`).join('');
    }

    function renderProjectRows(p, i) {
      const effect = p.economics && p.economics.total ? p.economics.total.actual : null;
      return `
        <tr class="data-row" data-idx="${i}">
          <td><button class="toggle-btn" data-idx="${i}">▶</button></td>
          <td><strong>${esc(p.code)}</strong></td>
          <td>${esc(p.name)}</td>
          <td>${esc(p.owner)}</td>
          <td>${esc(p.completedDate || '—')}</td>
          <td style="text-align:right">${fmtNum(p.hoursSaved)}</td>
          <td style="text-align:right">${fmtRub(effect)}</td>
        </tr>
        <tr class="expand-row" id="expand-${i}" style="display:none">
          <td colspan="7">${renderExpandInner(p)}</td>
        </tr>`;
    }

    function renderExpandInner(p) {
      const metricsHtml = p.metrics && p.metrics.length
        ? `<h4>Метрики</h4>
           <table class="expand-table">
             <thead><tr><th>Метрика</th><th>До</th><th>Целевое</th><th>Фактически</th><th>Откл.</th><th>Эффект</th></tr></thead>
             <tbody>${p.metrics.map(m => `
               <tr>
                 <td>${esc(m.name)}</td>
                 <td>${fmtNum(m.before)}</td>
                 <td>${fmtNum(m.target)}</td>
                 <td>${fmtNum(m.actual)}</td>
                 <td>${fmtNum(m.deviation)}</td>
                 <td>${fmtNum(m.effect)}</td>
               </tr>`).join('')}
             </tbody>
           </table>`
        : '';

      const pctClass = (pctRatio, isCosts) => {
        if (pctRatio == null || pctRatio === '') return '';
        const p = Number(pctRatio) * 100;
        if (p <= 80)  return isCosts ? 'pct-positive' : 'pct-negative';
        if (p <= 110) return '';
        return isCosts ? 'pct-negative' : 'pct-positive';
      };
      const fmtPctRatio = n =>
        (n == null || n === '') ? '—' : Math.round(Number(n) * 100) + '%';

      const econRow = (label, row, isCosts) => row ? `
        <tr>
          <td>${esc(label)}</td>
          <td>${fmtRub(row.target)}</td>
          <td>${fmtRub(row.actual)}</td>
          <td>${fmtRub(row.deviation)}</td>
          <td class="${pctClass(row.pct, isCosts)}">${fmtPctRatio(row.pct)}</td>
        </tr>` : '';

      const econHtml = p.economics ? `
        <h4>Экономический эффект</h4>
        <table class="expand-table">
          <thead><tr><th>Показатель</th><th>Целевое</th><th>Фактически</th><th>Отклонение</th><th>% достижения</th></tr></thead>
          <tbody>
            ${econRow('Доходы',       p.economics.income, false)}
            ${econRow('Затраты',      p.economics.costs,  true)}
            ${econRow('Итого эффект', p.economics.total,  false)}
          </tbody>
        </table>` : '';

      const commentHtml = p.comment
        ? `<h4>Комментарий ответственного</h4><div class="comment-box">${esc(p.comment)}</div>`
        : '';

      return `<div class="expand-inner">${metricsHtml}${econHtml}${commentHtml}</div>`;
    }

    function attachAccordion() {
      document.querySelectorAll('.data-row').forEach(row => {
        row.addEventListener('click', () => {
          const idx = row.dataset.idx;
          const expandRow = document.getElementById('expand-' + idx);
          const btn = row.querySelector('.toggle-btn');
          const isOpen = expandRow.style.display !== 'none';
          expandRow.style.display = isOpen ? 'none' : 'table-row';
          btn.classList.toggle('open', !isOpen);
        });
      });
    }

    function renderCharts(projects) {
      const counts = {};
      projects.forEach(p => {
        const depts = p.departments && p.departments.length ? p.departments : ['Не указано'];
        depts.forEach(dept => { counts[dept] = (counts[dept] || 0) + 1; });
      });
      const labels = Object.keys(counts);
      const data   = Object.values(counts);
      const colors = ['#C75239','#7B9F8F','#D4956A','#7A6A56','#BFB8AE','#4E7A6C'];

      const ctx = document.getElementById('deptChart');
      if (!ctx) return;
      new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{ data, backgroundColor: colors.slice(0, labels.length), borderWidth: 2 }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: { font: { family: 'Inter', size: 12 }, color: '#7A6A56', boxWidth: 14 },
            },
          },
        },
      });
    }

    init();
  </script>
</body>
</html>
